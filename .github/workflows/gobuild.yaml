name: Build and Release Rclone

on:
  push:
    branches:
      - "releases/custom-rclone"
  pull_request:
    branches:
      - "releases/custom-rclone"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.20'  # Set the Go version you need

    - name: Install dependencies
      run: |
        go mod tidy

    - name: Set up environment for the build
      run: |
        # Setup environment for cross-compilation (if required for specific OS/architecture)
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          export GOOS=linux
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          export GOOS=windows
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          export GOOS=darwin
        fi
        export GOARCH=${{ matrix.arch }}
        export CGO_ENABLED=0

    - name: Build Rclone
      run: |
        go build -a -installsuffix cgo -o rclonedev rclone.go

    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: rclone-build-${{ matrix.os }}-${{ matrix.arch }}
        path: rclonedev

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Create Release and Upload Binaries
      uses: softprops/action-gh-release@v1
      with:
        files: |
          rclonedev
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
